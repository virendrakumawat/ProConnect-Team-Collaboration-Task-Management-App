 
<div class="layout" [ngClass]="{'collapsed': isSidebarCollapsed}">
      <app-sidebar [collapsed]="isSidebarCollapsed"></app-sidebar>
    <div class="content" [ngClass]="{ 'darkMode': theme.themeMode() === 'dark', '': theme.themeMode() === 'light' }">

        <router-outlet></router-outlet>
        <app-footer></app-footer>
    </div>
</div>
