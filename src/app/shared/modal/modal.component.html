<div class="modal-overlay" (click)="closeModal()">
                <div class="modal-container" (click)="$event.stopPropagation()">
                    <div class="modal-header">
                        <h2 class="modal-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Create New Project
                        </h2>
                        <button class="modal-close" (click)="closeModal()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    
                    <form class="modal-form" (ngSubmit)="onSubmit()">
                        <div class="form-group">
                            <label for="projectName">Project Name *</label>
                            <input 
                                type="text" 
                                id="projectName" 
                                [(ngModel)]="newProject.name" 
                                name="name" 
                                placeholder="Enter project name"
                                required
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="projectDescription">Description *</label>
                            <textarea 
                                id="projectDescription" 
                                [(ngModel)]="newProject.description" 
                                name="description" 
                                placeholder="Describe your project"
                                rows="4"
                                required
                            ></textarea>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="dueDate">Due Date</label>
                                <input 
                                    type="date" 
                                    id="dueDate" 
                                    [(ngModel)]="newProject.dueDate" 
                                    name="dueDate"
                                >
                            </div>
                            
                            <div class="form-group">
                                <label for="priority">Priority</label>
                                <select id="priority" [(ngModel)]="newProject.priority" name="priority">
                                    <option value="low">Low</option>
                                    <option value="medium">Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status" [(ngModel)]="newProject.status" name="status">
                                <option value="active">Active</option>
                                <option value="on-hold">On Hold</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                        
                        <div class="modal-actions">
                            <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
                            <button type="submit" class="btn-create" [disabled]="!newProject.name || !newProject.description">Create Project</button>
                        </div>
                    </form>
                </div>
            </div>
